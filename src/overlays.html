<div class="live" id="vxLive" hidden>
  <div class="live-inner">
    <div class="live-top">
      <span class="chip" id="vxChip"></span>
      <span class="live-timer" id="vxTimer"></span>
    </div>
    <p class="live-status" id="vxStatus" aria-live="polite"></p>
    <div class="vx-stage" id="vxStage"></div>
    <div class="track" aria-hidden="true"><div class="bar" id="vxBar"></div></div>
    <p class="live-note" id="vxNote"></p>
    <div class="live-actions">
      <button type="button" class="btn" id="vxStop">Stop</button>
    </div>
  </div>
</div>
